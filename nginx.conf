events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # API proxy to backend
        location /api/ {
            proxy_pass http://backend:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            # Live-chat SSE under /api/embed/chat/.../stream
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Embed widget static assets (must not be proxied to API)
        location = /embed/chat/widget.html {
            try_files $uri =404;
            add_header Cache-Control "no-cache";
            # Allow customer sites to iframe the widget (overrides server SAMEORIGIN).
            add_header Content-Security-Policy "frame-ancestors *";
        }
        location = /embed/chat.js {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Embed chat public API (sessions, messages, journey, SSE stream)
        # Without this, POST → SPA try_files returns 405; GET stream returns index.html.
        location /embed/chat/ {
            proxy_pass http://backend:3000/embed/chat/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Other embed static scripts (webform, booking, headless help, etc.)
        location /embed/ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Binary downloads — never fall back to SPA shell
        location ~* \.zip$ {
            try_files $uri =404;
            add_header Content-Type application/zip;
        }

        # Vue.js SPA - all routes go to index.html
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache static assets
            location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}

