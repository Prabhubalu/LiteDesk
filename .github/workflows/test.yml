name: Run Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: test
          MONGO_INITDB_ROOT_PASSWORD: testpass
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./server
        run: npm run lint || true  # Continue even if linting fails
      
      - name: Run quotes unit tests
        working-directory: ./server
        run: npm run test:quotes
  
  lint-and-test-frontend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./client
        run: npm run lint || true  # Continue even if linting fails

      - name: i18n validation
        working-directory: ./client
        run: npm run i18n:check

      - name: i18n rollout report
        working-directory: ./client
        run: npm run i18n:report

      - name: i18n hardcoded scan (enforced paths)
        working-directory: ./client
        env:
          I18N_FAIL_ON_HARDCODED: '0'
        run: npm run i18n:find-hardcoded

      - name: i18n UI primitives gate
        working-directory: ./client
        env:
          I18N_FAIL_ON_HARDCODED: '1'
        run: node scripts/i18n/find-hardcoded.mjs --scoped --phase=ui

      - name: i18n layouts gate
        working-directory: ./client
        env:
          I18N_FAIL_ON_HARDCODED: '1'
        run: node scripts/i18n/find-hardcoded.mjs --scoped --phase=layouts

