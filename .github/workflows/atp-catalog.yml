name: ATP Catalog

on:
  pull_request:
    paths:
      - 'Automation_Testing.md'
      - 'atp/**'
  push:
    branches: [main, master]
    paths:
      - 'Automation_Testing.md'
      - 'atp/**'

jobs:
  catalog-sync-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: atp/package-lock.json
      - run: npm install
      - run: npm run catalog:sync
      - run: npm run catalog:check
