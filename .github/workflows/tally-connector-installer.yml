# Build Arivu Connector Windows installer without a local Windows PC.
# Uses GitHub-hosted windows-latest runners.
#
# Run: Actions → "Tally Connector Installer" → Run workflow
# Download artifacts: ArivuConnectorSetup.exe + arivu-connector-agent.exe

name: Tally Connector Installer

on:
  workflow_dispatch:
    inputs:
      publish_to_public:
        description: 'Also upload Setup EXE into client/public/connectors (artifact only; no auto-commit)'
        type: boolean
        default: true
  push:
    paths:
      - 'connectors/arivu-agent/**'
      - '.github/workflows/tally-connector-installer.yml'
    branches: [master, main]

permissions:
  contents: read

jobs:
  build-windows-installer:
    name: Build ArivuConnectorSetup.exe
    runs-on: windows-latest
    defaults:
      run:
        working-directory: connectors/arivu-agent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: connectors/arivu-agent/package.json

      - name: Install agent dependencies
        run: npm install --ignore-scripts

      - name: Download VC++ redistributable (x64)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\redist | Out-Null
          $out = "installer\redist\VC_redist.x64.exe"
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $out
          Get-Item $out | Select-Object FullName, Length

      - name: Package agent with pkg (win-x64)
        run: npx --yes pkg . --targets node18-win-x64 --output dist/arivu-connector-agent.exe

      - name: Preflight (sources for Inno)
        shell: pwsh
        run: |
          $agent = "dist\arivu-connector-agent.exe"
          $cfg = "installer\config.template.json"
          $vc = "installer\redist\VC_redist.x64.exe"
          if (-not (Test-Path $agent)) { throw "Missing $agent" }
          $len = (Get-Item $agent).Length
          if ($len -lt 1MB) { throw "Agent EXE too small ($len bytes) — pkg likely failed" }
          if (-not (Test-Path $cfg)) { throw "Missing $cfg" }
          if (-not (Test-Path $vc)) { throw "Missing $vc (VC++ redist download step failed)" }
          Write-Host "Preflight OK: agent=$len bytes, config+vc present"

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup install" }
          & $iscc /? 2>&1 | Select-Object -First 5
          Write-Host "ISCC path: $iscc"

      - name: Compile ArivuConnectorSetup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q "installer\arivu-connector.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "dist\installer\ArivuConnectorSetup.exe"
          if (-not (Test-Path $setup)) { throw "ArivuConnectorSetup.exe was not produced" }
          Write-Host "Setup OK: $((Get-Item $setup).Length) bytes → $setup"

      - name: Stage public connectors folder
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_to_public }}
        shell: pwsh
        run: |
          $dest = Join-Path $env:GITHUB_WORKSPACE "client\public\connectors"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -Force "dist\installer\ArivuConnectorSetup.exe" "$dest\ArivuConnectorSetup.exe"
          Copy-Item -Force "dist\arivu-connector-agent.exe" "$dest\arivu-connector-agent.exe"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arivu-connector-setup
          path: |
            connectors/arivu-agent/dist/installer/ArivuConnectorSetup.exe
            connectors/arivu-agent/dist/arivu-connector-agent.exe
          if-no-files-found: error
          retention-days: 30
