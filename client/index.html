<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
        <title>Arivu Systems | The mind of your business</title>
    <script src="/embed/legacy-brand-slug.js"></script>
    <script>
      (function() {
        // 1. Check local storage for user preference
        const storedMode = localStorage.getItem('color-mode');
        let mode = storedMode || 'system';

        // 2. Determine if the 'dark' class should be present
        let prefersDark;
        if (mode === 'system') {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } else if (mode === 'dark') {
          prefersDark = true;
        } else {
          // If mode is 'light', prefersDark remains false
          prefersDark = false;
        }

        // 3. Apply the 'dark' class instantly if needed
        if (prefersDark) {
          document.documentElement.classList.add('dark');
        }
        // If it's light mode, the 'dark' class is *not* added, ensuring light mode styles apply.
      })();
      // Restore AI dock rail before first paint so App Shell doesn't slide in after Vue mounts.
      (function() {
        try {
          var lb = window.ArivuLegacyBrand;
          var openFlag = localStorage.getItem('arivu_astra_side_panel_open_v1');
          var legacyOpen = localStorage.getItem(lb.storageKey('astra_side_panel_open_v1'));
          var legacy = null;
          try {
            legacy = JSON.parse(localStorage.getItem(lb.storageKey('arivu_support_panel_ui_v1')) || 'null');
          } catch (e2) {
            legacy = null;
          }
          var isOpen = openFlag === '1' || legacyOpen === '1' || (legacy && legacy.open === true);
          if (!isOpen) return;
          var rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
          if (!Number.isFinite(rem) || rem <= 0) rem = 16;
          var inset = 0.5 * rem;
          var gap = inset;
          var w = Number(
            localStorage.getItem('arivu_assistant_panel_width_v1')
            || localStorage.getItem(lb.storageKey('arivu_assistant_panel_width_v1'))
            || localStorage.getItem('arivu_arivu_assistant_panel_width_v1')
          );
          if (!Number.isFinite(w) || w < 320) {
            w = Math.round(window.innerWidth * 0.3);
          }
          var total = Math.round(w + gap + inset);
          document.documentElement.style.setProperty('--arivu-assistant-rail', total + 'px');
          document.documentElement.style.setProperty('--arivu-work-panel-pad-right', '0px');
          document.body.classList.add('arivu-assistant-rail-open');
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <!-- Before the app CSS bundle loads, avoid a white viewport flash when <html> already has .dark -->
    <style>
      html.dark,
      html.dark body {
        background-color: #111827;
        color-scheme: dark;
      }
    </style>
    <link rel="icon" href="/assets/logo/Logo_light.svg" type="image/svg+xml" sizes="any">
    <link rel="manifest" href="/manifest.json">
    <!-- Tailwind CSS v4 processes styles dynamically -->


  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
