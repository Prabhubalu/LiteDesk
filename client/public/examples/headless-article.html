<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <script>
      const target = '/examples/headless-article' + (window.location.search || '');
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to <a id="link" href="/examples/headless-article">headless article example</a>…</p>
    <script>
      document.getElementById('link').href = target;
    </script>
  </body>
</html>
